[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "20"

# SPA fallback — redirects all routes to index.html so React Router
# handles client-side routing (without this, refreshing on e.g. /admin
# gives a 404 from Netlify since that file doesn't physically exist)
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[context.production]
  command = "npm run build"

[context.deploy-preview]
  command = "npm run build"

[context.branch-deploy]
  command = "npm run build"